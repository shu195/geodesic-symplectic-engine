  <script>
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    });

    const CATEGORY_COLORS = {
      historical_session: '#8b5cf6',
      spacetime_topology: '#06b6d4',
      neural_architecture: '#10b981',
      high_performance_compute: '#f59e0b',
      memory_dynamics: '#ec4899',
      memory_architecture: '#f43f5e',
      pde_dynamics: '#3b82f6',
      hamiltonian_chaos: '#ef4444',
      symbolic_discovery: '#a855f7',
      meta_protocol: '#fb923c',
      chemistry_memory: '#fb7185',
      general: '#94a3b8'
    };

    let is3D = true;
    let rotX = 0.35;
    let rotY = 0.65;
    let zoom = 80;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;

    let selectedNode = null;
    let hoveredNode = null;
    let activePath = [];
    let predictedTrajectory = [];
    let predictedConvergedNode = null;
    let searchFilter = '';

    const nodeMap = new Map();
    const adjMap = new Map();

    GRAPH_DATA.nodes.forEach(n => {
      nodeMap.set(n.id, n);
      adjMap.set(n.id, []);
    });

    GRAPH_DATA.edges.forEach(e => {
      if (adjMap.has(e.source)) adjMap.get(e.source).push(e);
    });

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;
        if (e.shiftKey || e.button === 2) {
          panX += dx;
          panY += dy;
        } else {
          rotY += dx * 0.005;
          rotX += dy * 0.005;
        }
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      } else {
        checkHover(e.clientX, e.clientY);
      }
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoom *= (e.deltaY > 0 ? 0.92 : 1.08);
      zoom = Math.max(15, Math.min(300, zoom));
    }, { passive: false });

    canvas.addEventListener('click', (e) => {
      if (hoveredNode) {
        selectNode(hoveredNode);
      }
    });

    function checkHover(mx, my) {
      let closest = null;
      let minD = 18;

      GRAPH_DATA.nodes.forEach(n => {
        if (!n._screen) return;
        const d = Math.hypot(n._screen.x - mx, n._screen.y - my);
        if (d < minD) {
          minD = d;
          closest = n;
        }
      });

      hoveredNode = closest;
    }

    function project3D(x, y, z) {
      if (!is3D) {
        return {
          x: width / 2 + panX + x * (zoom * 0.8),
          y: height / 2 + panY + y * (zoom * 0.8),
          depth: 1
        };
      }

      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);
      const x1 = x * cosY - z * sinY;
      const z1 = x * sinY + z * cosY;

      const cosX = Math.cos(rotX);
      const sinX = Math.sin(rotX);
      const y2 = y * cosX - z1 * sinX;
      const z2 = y * sinX + z1 * cosX;

      const dist = 14;
      const pZ = z2 + dist;
      if (pZ < 0.1) return null;

      const scale = zoom / pZ;
      return {
        x: width / 2 + panX + x1 * scale * 10,
        y: height / 2 + panY + y2 * scale * 10,
        depth: pZ
      };
    }

    // Symplectic phase flow prediction simulation
    function simulateSymplecticFlow(startNode) {
      const q = [...startNode.coords];
      const omega = startNode.omega || 0.05;
      let p = [-omega * q[1], omega * q[0], 0.01];

      const dt = 0.08;
      const steps = 16;
      predictedTrajectory = [[...q]];

      for (let s = 0; s < steps; s++) {
        let F = [0, 0, 0];
        GRAPH_DATA.nodes.forEach(other => {
          if (other.id === startNode.id) return;
          const dx = other.coords[0] - q[0];
          const dy = other.coords[1] - q[1];
          const dz = other.coords[2] - q[2];
          const distSq = dx*dx + dy*dy + dz*dz + 0.5;
          const dist = Math.sqrt(distSq);
          const fMag = 4.208 / (distSq * dist);
          F[0] += dx * fMag;
          F[1] += dy * fMag;
          F[2] += dz * fMag;
        });

        // Kerr Coriolis force
        const fCorX = 2.0 * p[1] * omega;
        const fCorY = -2.0 * p[0] * omega;

        const fTotX = F[0] * 0.15 + fCorX;
        const fTotY = F[1] * 0.15 + fCorY;
        const fTotZ = F[2] * 0.15;

        p[0] += fTotX * dt;
        p[1] += fTotY * dt;
        p[2] += fTotZ * dt;

        q[0] += p[0] * dt;
        q[1] += p[1] * dt;
        q[2] += p[2] * dt;

        predictedTrajectory.push([...q]);
      }

      // Find converged node
      let closest = null;
      let minD = 1e9;
      const lastQ = predictedTrajectory[predictedTrajectory.length - 1];
      GRAPH_DATA.nodes.forEach(other => {
        if (other.id === startNode.id) return;
        const d = Math.hypot(other.coords[0] - lastQ[0], other.coords[1] - lastQ[1], other.coords[2] - lastQ[2]);
        if (d < minD) {
          minD = d;
          closest = other;
        }
      });

      predictedConvergedNode = closest;
    }

    let frame = 0;

      frame++;

      const centerProj = project3D(0, 0, 0);

        ctx.setLineDash([]);

      GRAPH_DATA.nodes.forEach(n => {
        n._screen = project3D(n.coords[0], n.coords[1], n.coords[2]);
      });

      // 3. Draw Edges
      ctx.lineWidth = 1;
      GRAPH_DATA.edges.forEach((e, idx) => {
        const s = nodeMap.get(e.source);
        const t = nodeMap.get(e.target);
        if (!s || !t || !s._screen || !t._screen) return;

        const isPath = activePath.length > 1 && activePath.includes(e.source) && activePath.includes(e.target);
        const isConnectedToSelected = selectedNode && (selectedNode.id === e.source || selectedNode.id === e.target);

        let alpha = 0.08;
        if (isPath) alpha = 0.9;
        else if (isConnectedToSelected) alpha = 0.65;
        else if (searchFilter) alpha = 0.03;

        ctx.strokeStyle = isPath ? '#22d3ee' : (isConnectedToSelected ? '#38bdf8' : 'rgba(148, 163, 184, ' + alpha + ')');
        ctx.lineWidth = isPath ? 2.5 : (isConnectedToSelected ? 1.5 : 0.7);

        ctx.beginPath();
        ctx.moveTo(s._screen.x, s._screen.y);
        ctx.lineTo(t._screen.x, t._screen.y);

          const px = s._screen.x + (t._screen.x - s._screen.x) * t_pulse;
          const py = s._screen.y + (t._screen.y - s._screen.y) * t_pulse;

          ctx.arc(px, py, isPath ? 3.0 : 1.5, 0, Math.PI * 2);

          if (!pScreen) return;
          if (first) {
            ctx.moveTo(pScreen.x, pScreen.y);
            first = false;
          } else {
            ctx.lineTo(pScreen.x, pScreen.y);
          }
        });
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 3.5;
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 12;
        ctx.stroke();
        ctx.shadowBlur = 0;

        const trajIdx = Math.floor((frame * 0.25) % (predictedTrajectory.length - 1));
        const p1 = predictedTrajectory[trajIdx];
        const p2 = predictedTrajectory[trajIdx + 1];
        const pScreen = project3D(p1[0], p1[1], p1[2]);
        if (pScreen) {
          ctx.fillStyle = '#34d399';
          ctx.beginPath();
          ctx.arc(pScreen.x, pScreen.y, 5, 0, Math.PI * 2);
          ctx.fill();

        const isSelected = (selectedNode && selectedNode.id === n.id);
        const isInPath = activePath.includes(n.id);

        const baseR = isSelected ? 8 : (isConvergedTarget ? 9 : (isHovered ? 7 : (isInPath ? 6 : Math.max(3.5, Math.min(8, 2.5 + (adjMap.get(n.id) || []).length * 0.25)))));
        const alpha = matchesSearch ? 1.0 : 0.15;

        if (isHovered || isSelected || isInPath || isConvergedTarget) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, baseR * 2.2, 0, Math.PI * 2);
          ctx.fillStyle = isConvergedTarget ? 'rgba(16, 185, 129, 0.5)' : (isSelected ? 'rgba(34, 211, 238, 0.4)' : (isInPath ? 'rgba(16, 185, 129, 0.4)' : 'rgba(255, 255, 255, 0.2)'));

        ctx.beginPath();
        ctx.arc(p.x, p.y, baseR, 0, Math.PI * 2);
        ctx.fillStyle = isConvergedTarget ? '#10b981' : color;

        ctx.fill();
        ctx.globalAlpha = 1.0;

        ctx.strokeStyle = isConvergedTarget ? '#34d399' : (isSelected ? '#ffffff' : (isHovered ? '#22d3ee' : 'rgba(255, 255, 255, 0.3)'));
        ctx.lineWidth = isConvergedTarget ? 3 : (isSelected ? 2 : 1);
        ctx.stroke();

        if (isSelected || isHovered || isInPath || isConvergedTarget || (n.category !== 'historical_session' && p.depth < 12)) {
          ctx.fillStyle = isConvergedTarget ? '#34d399' : (isSelected ? '#38bdf8' : '#f8fafc');
          ctx.font = (isSelected || isConvergedTarget ? 'bold 12px' : '11px') + ' ui-sans-serif, system-ui';
          const label = isConvergedTarget ? '🎯 PREDICTED: ' + n.concept.slice(0, 28) : n.concept.slice(0, 32);
          ctx.fillText(label, p.x + baseR + 5, p.y + 4);
        }
      });

      requestAnimationFrame(render);
    }

    // Node Selection & Drawer Logic
    const drawer = document.getElementById('nodeDrawer');
    const drawerTitle = document.getElementById('drawerTitle');
    const drawerCategory = document.getElementById('drawerCategory');
    const drawerR = document.getElementById('drawerR');
    const drawerOmega = document.getElementById('drawerOmega');
    const drawerEdges = document.getElementById('drawerEdges');
    const drawerPayload = document.getElementById('drawerPayload');
    let currentRes = 'meso';

    function selectNode(n) {
      selectedNode = n;
      drawerTitle.textContent = n.concept;
      drawerCategory.textContent = n.category;
      drawerCategory.style.borderColor = CATEGORY_COLORS[n.category] || '#94a3b8';
      drawerCategory.style.color = CATEGORY_COLORS[n.category] || '#94a3b8';

      drawerR.textContent = n.r.toFixed(2);
      drawerOmega.textContent = n.omega.toFixed(4);
      drawerEdges.textContent = (adjMap.get(n.id) || []).length;

      updateDrawerPayload();
      drawer.style.transform = 'translateX(0)';
    }

    function updateDrawerPayload() {
      if (!selectedNode) return;
      const p = selectedNode.payload;
      if (currentRes === 'macro') drawerPayload.textContent = p.macro || selectedNode.concept;
      else if (currentRes === 'meso') drawerPayload.textContent = p.meso || p.micro || '';
      else if (currentRes === 'micro') drawerPayload.textContent = p.micro || p.meso || '';
    }

    document.getElementById('tabMacro').addEventListener('click', (e) => switchRes('macro', e.target));
    document.getElementById('tabMeso').addEventListener('click', (e) => switchRes('meso', e.target));
    document.getElementById('tabMicro').addEventListener('click', (e) => switchRes('micro', e.target));

    function switchRes(res, btn) {
      currentRes = res;
      ['tabMacro', 'tabMeso', 'tabMicro'].forEach(id => {
        const b = document.getElementById(id);
        b.className = 'flex-1 py-1 rounded-lg font-medium text-[var(--muted-foreground,#94a3b8)] hover:text-white transition';
      });
      btn.className = 'flex-1 py-1 rounded-lg font-medium text-cyan-300 bg-cyan-500/20 border border-cyan-500/30 transition';
      updateDrawerPayload();
    }

    document.getElementById('closeDrawerBtn').addEventListener('click', () => {
      drawer.style.transform = 'translateX(110%)';
      selectedNode = null;
    });

    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    searchInput.addEventListener('input', (e) => {
      searchFilter = e.target.value.trim().toLowerCase();
      clearSearchBtn.classList.toggle('hidden', searchFilter.length === 0);
    });
    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchFilter = '';
      clearSearchBtn.classList.add('hidden');
    });

    document.getElementById('mode3dBtn').addEventListener('click', (e) => {
      is3D = true;
      e.target.className = 'px-3 py-1.5 rounded-lg font-medium bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 transition-all';
      document.getElementById('mode2dBtn').className = 'px-3 py-1.5 rounded-lg font-medium text-[var(--muted-foreground,#94a3b8)] hover:text-white transition-all';
    });
    document.getElementById('mode2dBtn').addEventListener('click', (e) => {
      is3D = false;
      e.target.className = 'px-3 py-1.5 rounded-lg font-medium bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 transition-all';
      document.getElementById('mode3dBtn').className = 'px-3 py-1.5 rounded-lg font-medium text-[var(--muted-foreground,#94a3b8)] hover:text-white transition-all';
    });

    document.getElementById('resetCamBtn').addEventListener('click', () => {
      rotX = 0.35;
      rotY = 0.65;
      zoom = 80;
      panX = 0;
      panY = 0;
      activePath = [];
      predictedTrajectory = [];
      predictedConvergedNode = null;
    });

    // Predict Next Breakthrough Button
    document.getElementById('predictFlowBtn').addEventListener('click', () => {
      const startNode = selectedNode || nodeMap.get('3849c2611c06') || GRAPH_DATA.nodes[0]; // Default to Operator Neurons
      selectNode(startNode);
      simulateSymplecticFlow(startNode);
    });

    document.getElementById('predictFromThisBtn').addEventListener('click', () => {
      if (selectedNode) {
        simulateSymplecticFlow(selectedNode);
      }
    });

    document.getElementById('traverseSampleBtn').addEventListener('click', () => {
      activePath = ['4a964b2030e2', '96f8f9d8392b', 'c212fd6f0416', '8b60ffa7d47f'];
      const targetNode = nodeMap.get(activePath[0]);
      if (targetNode) selectNode(targetNode);
    });

    document.getElementById('traverseFromThisBtn').addEventListener('click', () => {
      if (!selectedNode) return;
      const outgoing = adjMap.get(selectedNode.id) || [];
      if (outgoing.length > 0) {
        outgoing.sort((a, b) => b.weight - a.weight);
        const topNext = outgoing[0].target;
        activePath = [selectedNode.id, topNext];
        const nextNode = nodeMap.get(topNext);
        if (nextNode) selectNode(nextNode);
      }
    });

    render();
  </script>
</body>
</html>
